# Deploys the static site in docs/ to GitHub Pages.
#
# One-time setup (repository owner): Settings → Pages → "Build and deployment"
# → Source: "GitHub Actions". The configure-pages step also tries to enable
# Pages automatically on the first run. After that, every push to main that
# touches docs/ redeploys the site; "Run workflow" redeploys on demand.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
